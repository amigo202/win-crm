<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WIN CRM – אמיתי כהן</title>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root{--primary:#0f172a;--accent:#f97316;--accent-dark:#ea6c0a;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:10px;--sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 14px rgba(0,0,0,.10);--sh-lg:0 16px 48px rgba(0,0,0,.18)}
[data-theme=dark]{--bg:#070d1a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--sh:0 1px 3px rgba(0,0,0,.3);--sh-md:0 4px 14px rgba(0,0,0,.4);--sh-lg:0 16px 48px rgba(0,0,0,.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{direction:rtl;font-family:'Rubik','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);height:100%;font-size:14px;line-height:1.5}
#root{height:100vh}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.logo-w{width:38px;height:38px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 4px 10px rgba(249,115,22,.4)}
.logo-t h1{color:#f1f5f9;font-size:16px;font-weight:700}
.logo-t p{font-size:11px;color:#475569;margin-top:1px}
.sidebar-nav{flex:1;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;color:#94a3b8;width:100%;text-align:right;font-family:inherit}
.nav-item:hover{background:#1e293b;color:#e2e8f0}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-right:auto;background:var(--danger);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;animation:pulse 2s ease-in-out infinite}
.sidebar-foot{padding:14px;border-top:1px solid #1e293b}
.dark-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#1e293b;border:none;border-radius:8px;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:inherit}
.dark-btn:hover{background:#334155;color:#e2e8f0}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.ph{padding:26px 30px 0;display:flex;align-items:center;justify-content:space-between}
.ph h2{font-size:21px;font-weight:700}
.pb{padding:18px 30px 36px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-dark)}
.btn-o{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-o:hover{background:var(--bg)}
.btn-sm{padding:5px 11px;font-size:12px}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.del-link{background:none;border:none;cursor:pointer;color:var(--danger);font-size:13px;font-weight:500;font-family:inherit;padding:7px 12px;border-radius:6px;margin-right:auto}
.del-link:hover{background:#fee2e2}
/* Card */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden}
.card-hd{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-hd h3{font-size:13px;font-weight:600}
/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--sh);border:1px solid var(--border);animation:fadeUp .4s ease both}
.stat-card:nth-child(1){animation-delay:.04s}.stat-card:nth-child(2){animation-delay:.08s}
.stat-card:nth-child(3){animation-delay:.12s}.stat-card:nth-child(4){animation-delay:.16s}
.stat-card:nth-child(5){animation-delay:.20s}.stat-card:nth-child(6){animation-delay:.24s}
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.sl{font-size:12px;color:var(--muted);font-weight:500}
.si{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sv{font-size:26px;font-weight:700;line-height:1}
.ss{font-size:12px;color:var(--muted);margin-top:4px}
/* Dashboard layout */
.db-row{display:grid;grid-template-columns:1fr 270px;gap:18px;margin-bottom:18px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--sh);padding:16px;animation:fadeUp .4s ease both}
.chart-card:nth-child(1){animation-delay:.28s}.chart-card:nth-child(2){animation-delay:.32s}
.chart-card:nth-child(3){animation-delay:.36s}.chart-card:nth-child(4){animation-delay:.40s}
.ct{font-size:13px;font-weight:600;margin-bottom:12px}
/* Alerts panel */
.alerts-panel{background:var(--surface);border-radius:var(--radius);border:2px solid #fee2e2;box-shadow:var(--sh);overflow:hidden}
[data-theme=dark] .alerts-panel{border-color:#4c0519}
.alerts-hd{padding:12px 16px;background:#fee2e2;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#991b1b}
[data-theme=dark] .alerts-hd{background:#4c0519;color:#fca5a5}
.alert-section{padding:10px 14px;border-bottom:1px solid var(--border)}
.alert-section:last-child{border-bottom:none}
.alert-section h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.alert-row{font-size:12px;color:var(--text);padding:3px 0;display:flex;align-items:center;gap:6px}
.alert-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:9px 14px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#d1fae5;color:#065f46}
.b-yellow{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}
.b-gray{background:#f1f5f9;color:#475569}.b-purple{background:#ede9fe;color:#5b21b6}
.b-orange{background:#ffedd5;color:#c2410c}.b-teal{background:#ccfbf1;color:#0f766e}
[data-theme=dark] .b-blue{background:#1e3a5f;color:#93c5fd}[data-theme=dark] .b-green{background:#064e3b;color:#6ee7b7}
[data-theme=dark] .b-yellow{background:#451a03;color:#fcd34d}[data-theme=dark] .b-red{background:#4c0519;color:#fca5a5}
[data-theme=dark] .b-gray{background:#1e293b;color:#94a3b8}[data-theme=dark] .b-purple{background:#2e1065;color:#c4b5fd}
[data-theme=dark] .b-orange{background:#431407;color:#fb923c}[data-theme=dark] .b-teal{background:#042f2e;color:#5eead4}
/* Filter pills */
.filter-bar{display:flex;gap:7px;padding:11px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.fp{padding:4px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:500}
.fp.on{background:var(--primary);border-color:var(--primary);color:#fff}
.fp-cnt{background:rgba(0,0,0,.1);border-radius:10px;font-size:11px;padding:0 5px;margin-right:3px}
.fp.on .fp-cnt{background:rgba(255,255,255,.2)}
/* Search */
.search-bar{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;gap:7px}
.si-input{flex:1;padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--bg);color:var(--text);outline:none;text-align:right;font-family:inherit}
.si-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:13px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:slideIn .22s ease}
.modal-lg{max-width:740px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.mh h3{font-size:15px;font-weight:600}
.mx{background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;display:flex;align-items:center;padding:2px 5px;border-radius:5px;line-height:1}
.mx:hover{background:var(--bg)}
.mb{padding:20px 22px}
.mf{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:var(--surface)}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 22px}
.tab{padding:10px 15px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;font-family:inherit}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* Type selector */
.type-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px}
.tt{padding:9px 4px;border:2px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-size:11px;font-weight:500;color:var(--muted);text-align:center;transition:all .15s;font-family:inherit}
.tt.on{border-color:var(--accent);color:var(--accent);background:rgba(249,115,22,.06)}
.tt-ico{font-size:20px;display:block;margin-bottom:3px}
/* Form */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow{display:flex;flex-direction:column;gap:4px}
.frow.full{grid-column:1/-1}
label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--surface);outline:none;text-align:right;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
textarea{resize:vertical;min-height:70px}
/* Program checkboxes */
.prog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.prog-cb{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.prog-cb.on{border-color:var(--accent);background:rgba(249,115,22,.07);color:var(--accent)}
.prog-cb input[type=checkbox]{display:none}
/* Tags */
.tags-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:14px;font-size:12px;font-weight:500}
.tag-x{cursor:pointer;opacity:.65;font-size:15px;line-height:1;margin-right:-2px}
.tag-x:hover{opacity:1}
.cdots{display:flex;gap:5px;margin-top:5px}
.cdot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;outline:2px solid transparent;outline-offset:2px}
.cdot:hover,.cdot.sel{transform:scale(1.3);outline-color:var(--border)}
/* Notes / activity */
.note-item{padding:10px 0;border-bottom:1px solid var(--border)}
.note-item:last-child{border-bottom:none}
.note-date{font-size:11px;color:var(--muted);margin-bottom:3px}
.note-text{font-size:13px;white-space:pre-wrap}
.act-item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px}
.act-d{font-size:13px}.act-dt{font-size:11px;color:var(--muted);margin-top:2px}
/* Avatar */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.ac-cell{display:flex;gap:3px;justify-content:flex-end}
/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.kcol{min-width:190px;width:190px;flex-shrink:0;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column}
.kch{padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kcnt{background:rgba(0,0,0,.08);color:var(--muted);border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
[data-theme=dark] .kcnt{background:rgba(255,255,255,.08)}
.kval{padding:4px 12px 7px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.kbody{padding:7px;display:flex;flex-direction:column;gap:7px;min-height:70px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:pointer;transition:all .15s}
.kcard:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kct{font-size:12px;font-weight:600;margin-bottom:4px}
.kcm{font-size:11px;color:var(--muted)}
.kcv{font-size:13px;font-weight:700;color:var(--accent);margin-top:5px}
.kadd{display:flex;align-items:center;gap:3px;padding:6px 9px;background:none;border:1px dashed var(--border);border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);width:100%;font-family:inherit;transition:all .15s}
.kadd:hover{background:var(--surface);color:var(--text)}
/* Tasks */
.task-row{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--bg)}
.tck{width:19px;height:19px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.tck.dn{background:var(--success);border-color:var(--success);color:#fff}
.tb{flex:1;min-width:0}
.tt-txt{font-size:13px;font-weight:500}
.tt-txt.dn{text-decoration:line-through;color:var(--muted)}
.tm{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center}
.ta{display:flex;gap:3px;opacity:0;transition:opacity .15s}
.task-row:hover .ta{opacity:1}
/* Session/attendance row */
.sess-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.sess-row:last-child{border-bottom:none}
/* Summary box */
.sumbox{background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:20px;font-size:13px}
.sumbox span{font-weight:700;color:var(--accent)}
/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-ico{font-size:34px;margin-bottom:8px}
/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* DB ↔ JS mapping (snake_case ↔ camelCase) */

function fromDbInstructor(r){return{id:r.id,name:r.name,phone:r.phone,email:r.email,programs:r.programs||[],hourlyRate:r.hourly_rate,sessions:r.sessions||[],createdAt:r.created_at};}

/* ═══════════════ ALERT UTILS ═══════════════ */
function missed2Consec(att){
  if(!att||att.length<2)return false;
  const s=[...att].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return !s[0].present&&!s[1].present;
}
function noSessionDays(inst,days=14){
  const ss=inst.sessions||[];
  if(!ss.length)return true;
  const last=ss.reduce((m,s)=>new Date(s.date)>new Date(m.date)?s:m);
  return (Date.now()-new Date(last.date))/(86400000)>days;
}
function stuckDays(deal,days=30){
  if(!['meeting','proposal'].includes(deal.stage))return false;
  return (Date.now()-new Date(deal.createdAt))/(86400000)>days;
}
function monthlyHours(inst){
  const n=new Date();
  return (inst.sessions||[]).filter(s=>{const d=new Date(s.date);return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()}).reduce((sum,s)=>sum+Number(s.hours||0),0);
}
function monthlyPay(inst){return monthlyHours(inst)*Number(inst.hourlyRate||0);}
function attPct(student){
  const a=student.attendance||[];
  if(!a.length)return null;
  return Math.round(a.filter(x=>x.present).length/a.length*100);
}
function studentStatus(student){
  const a=[...(student.attendance||[])].sort((x,y)=>new Date(y.date)-new Date(x.date));
  if(a.length>=2&&!a[0].present&&!a[1].present)return'risk';
  if(a.length>=1&&!a[0].present)return'warn';
  return'ok';
}
function computeAlerts(tasks,instructors,students,deals){
  const now=new Date();now.setHours(0,0,0,0);
  return{
    overdue:tasks.filter(t=>!t.completed&&t.dueDate&&new Date(t.dueDate)<now),
    instructors:instructors.filter(i=>noSessionDays(i,14)),
    students:students.filter(s=>studentStatus(s)==='risk'),
    deals:deals.filter(d=>stuckDays(d,30)),
  };
}

function exportInstructorsCSV(instructors){
  const hd=['שם','טלפון','תוכניות','תעריף/שעה','שעות חודש','תשלום חודש'];
  const rows=instructors.map(i=>[i.name||'',i.phone||'',(i.programs||[]).join(';'),i.hourlyRate||0,monthlyHours(i),monthlyPay(i)]);
  dlCSV('win-crm-instructors.csv',hd,rows);
}
function dlCSV(name,hd,rows){
  const bom='\uFEFF';
  const csv=bom+[hd,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  Object.assign(document.createElement('a'),{href:url,download:name}).click();
  URL.revokeObjectURL(url);
}
function splitCSV(line){const v=[];let c='',q=false;for(const ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){v.push(c.replace(/^"|"$/g,''));c='';}else c+=ch;}v.push(c.replace(/^"|"$/g,''));return v;}
function parseCSV(text){const L=text.trim().split(/\r?\n/);if(L.length<2)return[];const hd=splitCSV(L[0]);return L.slice(1).map(l=>{const v=splitCSV(l);const o={};hd.forEach((h,i)=>o[h]=v[i]||'');return o;});}
function csvToContact(row){
  const tm={'בית ספר':'school','עירייה':'municipality','מתנ"ס':'community','מפיק אירועים':'event_producer','תלמיד פרטי':'private_student'};
  const sm={'ליד':'lead','פרוספקט':'prospect','פעיל':'customer','לא פעיל':'inactive'};
  const type=tm[row['סוג']]||'school';
  const base={type,name:row['שם']||'',contactPerson:row['איש קשר']||'',city:row['עיר']||'',phone:row['טלפון']||'',email:row['אימייל']||'',
    status:sm[row['סטטוס']]||'lead',activePrograms:(row['תוכניות']||'').split(';').filter(Boolean),tags:[],notes:[],activities:[]};
  if(type==='school'){base.principal=row['מנהל']||'';base.studentCount=row['מספר תלמידים']||'';}
  if(type==='municipality')base.department=row['מחלקה']||'';
  if(type==='community'){base.manager=row['מנהל']||'';base.targetAudience=row['קהל יעד']||'';}
  if(type==='event_producer')base.eventTypes=row['סוג אירוע']||'';
  if(type==='private_student'){base.age=row['גיל']||'';base.parentName=row['הורה']||'';base.program=row['תוכניות']||PROGRAMS[0];}
  return base;
}

            {label:'מדריכים',val:instructors.length,sub:instructors.filter(i=>!noSessionDays(i,14)).length+' פעילים',bg:'#fef3c7',ic:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>},
            {label:'תלמידים',val:students.length,sub:students.filter(s=>studentStatus(s)==='ok').length+' תקינים',bg:'#ccfbf1',ic:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" strokeWidth="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>},
            {label:'התראות',val:totalAlerts,sub:'דרושה תשומת לב',bg:'#fee2e2',ic:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>},
          ].map((s,i)=>(
            <div key={i} className="stat-card">
              <div className="sh">
                <span className="sl">{s.label}</span>
                <div className="si" style={{background:s.bg}}>{s.ic}</div>
              </div>
              <div className="sv" style={{fontSize:typeof s.val==='string'?18:26}}>{s.val}</div>
              <div className="ss">{s.sub}</div>
            </div>
          ))}
        </div>

        {/* Charts + Alerts */}
        <div className="db-row">
          <div className="charts-grid">
            {[{ref:rRef,title:'הכנסות – 6 חודשים'},{ref:dRef,title:'לקוחות לפי סוג'},{ref:sRef,title:'עסקאות לפי שלב'},{ref:pRef,title:'תלמידים לפי תוכנית'}].map((c,i)=>(
              <div key={i} className="chart-card">
                <div className="ct">{c.title}</div>
                <div style={{height:175}}><canvas ref={c.ref}></canvas></div>
              </div>
            ))}
          </div>

          {/* Alerts panel */}
          <div className="alerts-panel">
            <div className="alerts-hd"><Ico.alert/> התראות ({totalAlerts})</div>
            {als.overdue.length>0&&<div className="alert-section"><h4>משימות באיחור ({als.overdue.length})</h4>{als.overdue.slice(0,4).map(t=><div key={t.id} className="alert-row"><div className="alert-dot"/>{t.title}</div>)}</div>}
            {als.instructors.length>0&&<div className="alert-section"><h4>מדריכים ללא דיווח ({als.instructors.length})</h4>{als.instructors.slice(0,4).map(i=><div key={i.id} className="alert-row"><div className="alert-dot"/>{i.name}</div>)}</div>}
            {als.students.length>0&&<div className="alert-section"><h4>תלמידים בסכנת נשירה ({als.students.length})</h4>{als.students.slice(0,4).map(s=><div key={s.id} className="alert-row"><div className="alert-dot"/>{s.name}</div>)}</div>}
            {als.deals.length>0&&<div className="alert-section"><h4>עסקאות תקועות ({als.deals.length})</h4>{als.deals.slice(0,4).map(d=><div key={d.id} className="alert-row"><div className="alert-dot"/>{d.title}</div>)}</div>}
            {totalAlerts===0&&<div style={{padding:'20px 14px',fontSize:13,color:'var(--muted)',textAlign:'center'}}>אין התראות 🎉</div>}
          </div>
        </div>

        {/* Recent activity */}
        <div className="card">
          <div className="card-hd"><h3>פעילות אחרונה</h3></div>
          {recentActs.length===0?<div className="empty"><p>אין פעילות עדיין</p></div>
            :<div style={{padding:'4px 18px 6px'}}>{recentActs.map(a=><div key={a.id} className="act-item"><div className="act-dot"/><div><div className="act-d">{a.desc} <span style={{color:'var(--muted)',fontWeight:500}}>– {a.cn}</span></div><div className="act-dt">{fmtDT(a.date)}</div></div></div>)}</div>}
        </div>
      </div>
    </>
  );
}

/* ═══════════════ CONTACT MODAL ═══════════════ */
function ContactModal({contact,deals,onSave,onClose}){
  const isE=!!contact;
  const [tab,setTab]=useState('details');
  const [selType,setSelType]=useState(contact?.type||'school');
  const [nt,setNt]=useState('');
  const [ti,setTi]=useState('');
  const [tc,setTc]=useState(0);
  const [form,setForm]=useState(()=>contact?{...contact}:{
    type:'school',name:'',contactPerson:'',phone:'',email:'',city:'',status:'lead',
    activePrograms:[],tags:[],notes:[],activities:[],
    principal:'',studentCount:'',department:'',manager:'',targetAudience:'',
    eventTypes:'',age:'',parentName:'',program:PROGRAMS[0],
  });
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const toggleProg=p=>setForm(prev=>({...prev,activePrograms:(prev.activePrograms||[]).includes(p)?(prev.activePrograms||[]).filter(x=>x!==p):[...(prev.activePrograms||[]),p]}));
  const addNote=()=>{
    if(!nt.trim())return;
    const now=new Date().toISOString();
    const note={id:genId(),text:nt.trim(),date:now};
    const act={id:genId(),desc:`הוספת הערה: ${nt.trim().slice(0,35)}`,date:now};
    setForm(p=>({...p,notes:[note,...(p.notes||[])],activities:[...(p.activities||[]),act]}));
    setNt('');
  };
  const addTag=()=>{
    if(!ti.trim())return;
    setForm(p=>({...p,tags:[...(p.tags||[]),{label:ti.trim(),color:TAG_COLORS[tc]}]}));
    setTi('');
  };
  const rmTag=i=>setForm(p=>({...p,tags:(p.tags||[]).filter((_,j)=>j!==i)}));
  const save=()=>{if(!form.name.trim())return;onSave({...form,type:isE?form.type:selType,updatedAt:new Date().toISOString()});onClose();};
  const sub=e=>{e.preventDefault();save();};
  const linked=(deals||[]).filter(d=>d.contactId===contact?.id);

  function TypeFields({t}){
    if(t==='school')return<><div className="frow"><label>שם מנהל</label><input value={form.principal||''} onChange={f('principal')} placeholder="שם מנהל"/></div><div className="frow"><label>מספר תלמידים</label><input type="number" value={form.studentCount||''} onChange={f('studentCount')} placeholder="500"/></div></>;
    if(t==='municipality')return<><div className="frow"><label>איש קשר</label><input value={form.contactPerson||''} onChange={f('contactPerson')} placeholder="שם"/></div><div className="frow"><label>מחלקה</label><input value={form.department||''} onChange={f('department')} placeholder="חינוך"/></div></>;
    if(t==='community')return<><div className="frow"><label>מנהל</label><input value={form.manager||''} onChange={f('manager')} placeholder="שם מנהל"/></div><div className="frow"><label>קהל יעד</label><input value={form.targetAudience||''} onChange={f('targetAudience')} placeholder="ילדים, נוער"/></div></>;
    if(t==='event_producer')return<><div className="frow"><label>איש קשר</label><input value={form.contactPerson||''} onChange={f('contactPerson')} placeholder="שם"/></div><div className="frow full"><label>סוגי אירועים</label><input value={form.eventTypes||''} onChange={f('eventTypes')} placeholder="ימי הולדת, אירועי חברה"/></div></>;
    if(t==='private_student')return<><div className="frow"><label>גיל</label><input type="number" value={form.age||''} onChange={f('age')} placeholder="12"/></div><div className="frow"><label>שם הורה</label><input value={form.parentName||''} onChange={f('parentName')} placeholder="שם"/></div><div className="frow full"><label>תוכנית</label><select value={form.program||PROGRAMS[0]} onChange={f('program')}>{PROGRAMS.map(p=><option key={p} value={p}>{p}</option>)}</select></div></>;
    return null;
  }

  const DetailForm=({curType})=>(
    <form onSubmit={sub}>
      <div className="mb">
        {!isE&&<div className="type-tabs">{CONTACT_TYPES.map(t=><button key={t.id} type="button" className={`tt ${selType===t.id?'on':''}`} onClick={()=>setSelType(t.id)}><span className="tt-ico">{t.icon}</span>{t.label}</button>)}</div>}
        <div className="fg">
          <div className="frow full"><label>שם *</label><input required value={form.name} onChange={f('name')} placeholder="שם..."/></div>
          <div className="frow"><label>טלפון</label><input type="tel" value={form.phone||''} onChange={f('phone')} placeholder="050-0000000"/></div>
          <div className="frow"><label>אימייל</label><input type="email" value={form.email||''} onChange={f('email')} placeholder="email@..."/></div>
          <div className="frow"><label>עיר</label><input value={form.city||''} onChange={f('city')} placeholder="תל אביב"/></div>
          <div className="frow"><label>סטטוס</label><select value={form.status} onChange={f('status')}>{STATUS_OPTS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></div>
          {TypeFields({t:curType})}
          {curType!=='private_student'&&<div className="frow full"><label>תוכניות פעילות</label><div className="prog-grid">{PROGRAMS.map(p=><label key={p} className={`prog-cb ${(form.activePrograms||[]).includes(p)?'on':''}`}><input type="checkbox" checked={(form.activePrograms||[]).includes(p)} onChange={()=>toggleProg(p)}/>{p}</label>)}</div></div>}
          {isE&&<div className="frow full"><label>תגיות</label>
            <div style={{display:'flex',gap:6}}><input value={ti} onChange={e=>setTi(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(e.preventDefault(),addTag())} placeholder="תגית + Enter..." style={{flex:1}}/><button type="button" className="btn btn-o btn-sm" onClick={addTag}>+</button></div>
            <div className="cdots">{TAG_COLORS.map((c,i)=><div key={i} className={`cdot ${tc===i?'sel':''}`} style={{background:c.dot}} onClick={()=>setTc(i)}/>)}</div>
            {(form.tags||[]).length>0&&<div className="tags-wrap">{(form.tags||[]).map((tag,i)=><span key={i} className="tag" style={{background:tag.color?.bg||'#f1f5f9',color:tag.color?.text||'#475569'}}>{tag.label}<span className="tag-x" onClick={()=>rmTag(i)}>×</span></span>)}</div>}
          </div>}
        </div>
      </div>
      <div className="mf"><button type="submit" className="btn btn-p">{isE?'שמור':'הוסף'}</button><button type="button" className="btn btn-o" onClick={onClose}>ביטול</button></div>
    </form>
  );

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal ${isE?'modal-lg':''}`}>
        <div className="mh"><h3>{isE?`עריכת ${form.name}`:'הוספת איש קשר'}</h3><button className="mx" onClick={onClose}>×</button></div>
        {isE?(
          <>
            <div className="tabs">{[['details','פרטים'],['notes','הערות'],['deals','עסקאות'],['history','היסטוריה']].map(([id,lb])=><button key={id} className={`tab ${tab===id?'on':''}`} onClick={()=>setTab(id)}>{lb}</button>)}</div>
            {tab==='details'&&DetailForm({curType:form.type})}
            {tab==='notes'&&<div className="mb">
              <div style={{display:'flex',gap:7,marginBottom:14}}><textarea value={nt} onChange={e=>setNt(e.target.value)} placeholder="הוסף הערה..." style={{flex:1,minHeight:65}}/><button className="btn btn-p" onClick={addNote} style={{alignSelf:'flex-end',flexShrink:0}}>הוסף</button></div>
              {!(form.notes||[]).length?<div className="empty"><p>אין הערות</p></div>:(form.notes||[]).map(n=><div key={n.id} className="note-item"><div className="note-date">{fmtDT(n.date)}</div><div className="note-text">{n.text}</div></div>)}
              <div className="mf"><button className="btn btn-p" onClick={save}>שמור</button><button className="btn btn-o" onClick={onClose}>סגור</button></div>
            </div>}
            {tab==='deals'&&<div className="mb">
              {!linked.length?<div className="empty"><div className="empty-ico">💼</div><p>אין עסקאות מקושרות</p></div>:linked.map(d=>{const st=STAGES.find(s=>s.id===d.stage);return<div key={d.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)'}}><div><div style={{fontWeight:600,fontSize:13}}>{d.title}</div><div style={{fontSize:12,color:st?.color||'var(--muted)',marginTop:2}}>{st?.label}</div></div><span style={{fontWeight:700,color:'var(--accent)'}}>{fmtShekel(d.value)}</span></div>;})}
              <div className="mf"><button className="btn btn-o" onClick={onClose}>סגור</button></div>
            </div>}
            {tab==='history'&&<div className="mb">
              {!(form.activities||[]).length?<div className="empty"><p>אין היסטוריה</p></div>:[...(form.activities||[])].reverse().map(a=><div key={a.id} className="act-item"><div className="act-dot"/><div><div className="act-d">{a.desc}</div><div className="act-dt">{fmtDT(a.date)}</div></div></div>)}
              <div className="mf"><button className="btn btn-o" onClick={onClose}>סגור</button></div>
            </div>}
          </>
        ):DetailForm({curType:selType})}
      </div>
    </div>
  );
}

/* ═══════════════ CONTACTS PAGE ═══════════════ */
function ContactsPage({contacts,deals,onAdd,onUpdate,onDelete}){
  const [tf,setTf]=useState('all');
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const fRef=useRef(null);
  const filtered=contacts.filter(c=>{
    if(tf!=='all'&&c.type!==tf)return false;
    if(q){const ql=q.toLowerCase();return[c.name,c.email,c.city,c.phone,c.contactPerson].some(v=>v?.toLowerCase().includes(ql));}
    return true;
  });
  function keyInfo(c){
    if(c.type==='school')return[c.city,c.studentCount?c.studentCount+' תלמידים':''].filter(Boolean).join(' • ');
    if(c.type==='municipality')return[c.city,c.department].filter(Boolean).join(' • ');
    if(c.type==='community')return[c.city,c.targetAudience].filter(Boolean).join(' • ');
    if(c.type==='event_producer')return c.eventTypes||c.city||'';
    if(c.type==='private_student')return[c.program,c.age?'גיל '+c.age:''].filter(Boolean).join(' • ');
    return c.city||'';
  }
  const impCSV=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{parseCSV(ev.target.result).forEach(row=>{const c=csvToContact(row);if(c.name)onAdd(c);});};r.readAsText(f,'UTF-8');e.target.value='';};
  return(
    <>
      <div className="ph"><h2>אנשי קשר</h2>
        <div style={{display:'flex',gap:7}}>
          <button className="btn btn-o btn-sm" onClick={()=>exportContactsCSV(contacts)}><Ico.dl/>ייצוא</button>
          <button className="btn btn-o btn-sm" onClick={()=>fRef.current?.click()}><Ico.ul/>ייבוא</button>
          <input ref={fRef} type="file" accept=".csv" onChange={impCSV} style={{display:'none'}}/>
          <button className="btn btn-p" onClick={()=>setModal({mode:'add'})}><Ico.plus/>הוסף</button>
        </div>
      </div>
      <div className="pb">
        <div className="card">
          <div className="filter-bar">
            {[{id:'all',label:'הכל'},...CONTACT_TYPES].map(t=>{const cnt=t.id==='all'?contacts.length:contacts.filter(c=>c.type===t.id).length;return<button key={t.id} className={`fp ${tf===t.id?'on':''}`} onClick={()=>setTf(t.id)}>{t.label}<span className="fp-cnt">{cnt}</span></button>;})}
          </div>
          <div className="search-bar"><input className="si-input" value={q} onChange={e=>setQ(e.target.value)} placeholder="חיפוש שם, עיר, אימייל..."/></div>
          <div className="tbl-wrap">
            {!filtered.length?<div className="empty"><div className="empty-ico">👥</div><p>{q?`לא נמצאו תוצאות`:'לחץ "הוסף" להוסיף איש קשר ראשון'}</p></div>:
            <table><thead><tr><th>שם</th><th>סוג</th><th>מידע</th><th>תוכניות</th><th>סטטוס</th><th></th></tr></thead>
            <tbody>{filtered.map(c=>{const ti=CONTACT_TYPES.find(t=>t.id===c.type);const si=STATUS_OPTS.find(s=>s.value===c.status)||STATUS_OPTS[0];return(
              <tr key={c.id}>
                <td><div style={{display:'flex',alignItems:'center',gap:9}}><div className="av" style={{width:31,height:31,fontSize:12,background:avBg(c.name)}}>{ini(c.name)}</div><div><div style={{fontWeight:600}}>{c.name}</div><div style={{fontSize:11,color:'var(--muted)'}}>{c.email||c.phone||''}</div></div></div></td>
                <td><span className={`badge ${ti?.badge||'b-gray'}`}>{ti?.label}</span></td>
                <td><span style={{fontSize:12,color:'var(--muted)'}}>{keyInfo(c)}</span></td>
                <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{(c.activePrograms||[c.program]).filter(Boolean).slice(0,3).map((p,i)=><span key={i} className="badge b-teal" style={{fontSize:11,padding:'1px 7px'}}>{p}</span>)}</div></td>
                <td><span className={`badge ${si.badge}`}>{si.label}</span></td>
                <td><div className="ac-cell">
                  <button className="icon-btn" onClick={()=>setModal({mode:'edit',contact:c})}><Ico.edit/></button>
                  <button className="icon-btn" style={{color:'var(--danger)'}} onClick={()=>{if(window.confirm(`למחוק ${c.name}?`))onDelete(c.id);}}><Ico.trash/></button>
                </div></td>
              </tr>);})}</tbody></table>}
          </div>
        </div>
      </div>
      {modal&&<ContactModal contact={modal.mode==='edit'?modal.contact:null} deals={deals} onSave={d=>modal.mode==='edit'?onUpdate(modal.contact.id,d):onAdd(d)} onClose={()=>setModal(null)}/>}
    </>
  );
}

/* ═══════════════ DEAL MODAL ═══════════════ */
function DealModal({deal,contacts,initStage,onSave,onClose,onDel}){
  const [form,setForm]=useState(()=>deal?{...deal}:{title:'',contactId:'',value:'',stage:initStage||'lead',program:'',closeDate:'',notes:''});
  const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const sub=e=>{e.preventDefault();if(!form.title.trim())return;onSave(form);onClose();};
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="mh"><h3>{deal?'עריכת עסקה':'עסקה חדשה'}</h3><button className="mx" onClick={onClose}>×</button></div>
        <form onSubmit={sub}>
          <div className="mb"><div className="fg">
            <div className="frow full"><label>שם *</label><input required value={form.title} onChange={f('title')} placeholder="שם העסקה"/></div>
            <div className="frow"><label>איש קשר</label><select value={form.contactId} onChange={f('contactId')}><option value="">בחר...</option>{contacts.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
            <div className="frow"><label>שלב</label><select value={form.stage} onChange={f('stage')}>{STAGES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></div>
            <div className="frow"><label>שווי ₪</label><input type="number" value={form.value} onChange={f('value')} placeholder="0" min="0"/></div>
            <div className="frow"><label>תוכנית</label><select value={form.program} onChange={f('program')}><option value="">ללא</option>{PROGRAMS.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
            <div className="frow full"><label>תאריך סגירה</label><input type="date" value={form.closeDate} onChange={f('closeDate')}/></div>
            <div className="frow full"><label>הערות</label><textarea value={form.notes} onChange={f('notes')} placeholder="הערות..."/></div>
          </div></div>
          <div className="mf"><button type="submit" className="btn btn-p">{deal?'שמור':'הוסף'}</button><button type="button" className="btn btn-o" onClick={onClose}>ביטול</button>{deal&&<button type="button" className="del-link" onClick={()=>{if(window.confirm('למחוק?'))onDel(deal.id);}}>מחק</button>}</div>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════ DEALS PAGE ═══════════════ */
function DealsPage({deals,contacts,onAdd,onUpdate,onDelete}){
  const [modal,setModal]=useState(null);
  const pipe=deals.filter(d=>['lead','meeting','proposal'].includes(d.stage)).reduce((s,d)=>s+Number(d.value||0),0);
  const cname=id=>contacts.find(c=>c.id===id)?.name||'';
  return(
    <>
      <div className="ph"><h2>עסקאות</h2><div style={{display:'flex',gap:10,alignItems:'center'}}><span style={{color:'var(--muted)',fontSize:13}}>פייפליין: <strong>{fmtShekel(pipe)}</strong></span><button className="btn btn-p" onClick={()=>setModal({deal:null,stage:'lead'})}><Ico.plus/>הוסף</button></div></div>
      <div className="pb">
        <div className="kanban">
          {STAGES.map(stage=>{
            const sd=deals.filter(d=>d.stage===stage.id);
            const sv=sd.reduce((s,d)=>s+Number(d.value||0),0);
            return(
              <div key={stage.id} className="kcol">
                <div className="kch"><span style={{color:stage.color}}>{stage.label}</span><span className="kcnt">{sd.length}</span></div>
                {sv>0&&<div className="kval">{fmtShekel(sv)}</div>}
                <div className="kbody">

/* ═══════════════ TASKS PAGE ═══════════════ */
function TasksPage({tasks,contacts,onAdd,onUpdate,onDelete,onToggle}){
  const [filter,setFilter]=useState('open');
  const [modal,setModal]=useState(null);
  const today=new Date();today.setHours(0,0,0,0);
  const cnts={open:tasks.filter(t=>!t.completed).length,overdue:tasks.filter(t=>!t.completed&&t.dueDate&&new Date(t.dueDate)<today).length,done:tasks.filter(t=>t.completed).length,all:tasks.length};
  const filtered=tasks.filter(t=>{if(filter==='open')return!t.completed;if(filter==='overdue')return!t.completed&&t.dueDate&&new Date(t.dueDate)<today;if(filter==='done')return t.completed;return true;});
  const cname=id=>contacts.find(c=>c.id===id)?.name||'';
  function TaskModal({task}){
    const [form,setForm]=useState(()=>task||{title:'',contactId:'',priority:'medium',dueDate:''});
    const f=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
    const sub=e=>{e.preventDefault();if(!form.title.trim())return;task?onUpdate(task.id,form):onAdd(form);setModal(null);};
    return(<div className="overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}><div className="modal">
      <div className="mh"><h3>{task?'עריכת משימה':'משימה חדשה'}</h3><button className="mx" onClick={()=>setModal(null)}>×</button></div>
      <form onSubmit={sub}><div className="mb"><div className="fg">
        <div className="frow full"><label>כותרת *</label><input required value={form.title} onChange={f('title')} placeholder="תיאור..."/></div>
        <div className="frow"><label>עדיפות</label><select value={form.priority} onChange={f('priority')}>{PRIORITIES.map(p=><option key={p.value} value={p.value}>{p.label}</option>)}</select></div>
        <div className="frow"><label>תאריך יעד</label><input type="date" value={form.dueDate} onChange={f('dueDate')}/></div>
        <div className="frow full"><label>איש קשר</label><select value={form.contactId} onChange={f('contactId')}><option value="">ללא</option>{contacts.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
      </div></div>
      <div className="mf"><button type="submit" className="btn btn-p">{task?'שמור':'הוסף'}</button><button type="button" className="btn btn-o" onClick={()=>setModal(null)}>ביטול</button>{task&&<button type="button" className="del-link" onClick={()=>{if(window.confirm('למחוק?')){onDelete(task.id);setModal(null);}}}>מחק</button>}</div>
      </form></div></div>);
  }
  return(
    <>
      <div className="ph"><h2>משימות</h2><button className="btn btn-p" onClick={()=>setModal({task:null})}><Ico.plus/>הוסף</button></div>
      <div className="pb"><div className="card">
        <div className="filter-bar">{[{id:'open',l:'פתוחות'},{id:'overdue',l:'באיחור'},{id:'done',l:'הושלמו'},{id:'all',l:'הכל'}].map(f=><button key={f.id} className={`fp ${filter===f.id?'on':''}`} onClick={()=>setFilter(f.id)}>{f.l}<span className="fp-cnt">{cnts[f.id]}</span></button>)}</div>
        {!filtered.length?<div className="empty"><div className="empty-ico">✅</div><p>{filter==='open'?'אין משימות פתוחות':filter==='overdue'?'אין משימות באיחור':filter==='done'?'אין שהושלמו':'אין משימות'}</p></div>:
        filtered.map(t=>{const di=fmtDate(t.dueDate);const pr=PRIORITIES.find(p=>p.value===t.priority)||PRIORITIES[1];return(
          <div key={t.id} className="task-row">
            <div className={`tck ${t.completed?'dn':''}`} onClick={()=>onToggle(t.id)}>{t.completed&&<Ico.check/>}</div>
            <div className="tb"><div className={`tt-txt ${t.completed?'dn':''}`}>{t.title}</div>
              <div className="tm"><span className={`badge ${pr.badge}`}>{pr.label}</span>{t.contactId&&<span className="badge b-gray">{cname(t.contactId)}</span>}{di&&<span style={{fontSize:12,color:di.ov?'var(--danger)':'var(--muted)'}}>{di.text}{di.ov?' (באיחור)':''}</span>}</div>
            </div>
            <div className="ta"><button className="icon-btn" onClick={()=>setModal({task:t})}><Ico.edit/></button><button className="icon-btn" style={{color:'var(--danger)'}} onClick={()=>{if(window.confirm('למחוק?'))onDelete(t.id);}}><Ico.trash/></button></div>
          </div>);})}
      </div></div>
      {modal&&<TaskModal task={modal.task}/>}
    </>
  );
}

/* ═══════════════ INSTRUCTORS PAGE ═══════════════ */

      {isE&&tab==='sessions'&&<div className="mb">

        <button className="btn btn-p btn-sm" onClick={addSession} style={{marginBottom:12}}>+ הוסף שיעור</button>
        {!(form.sessions||[]).length?<div className="empty"><p>אין שיעורים רשומים</p></div>:
        [...(form.sessions||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(s=><div key={s.id} className="sess-row">

/* ═══════════════ AUTH SCREEN ═══════════════ */
function AuthScreen(){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const inp={width:'100%',padding:'9px 12px',background:'#0f172a',border:'1px solid #334155',borderRadius:'8px',color:'#f1f5f9',fontSize:'14px',outline:'none',fontFamily:'inherit',textAlign:'right',boxSizing:'border-box'};
  const submit=async e=>{
    e.preventDefault();setLoading(true);setError('');
    const {error:err}=await sb.auth.signInWithPassword({email,password});
    if(err)setError(err.message==='Invalid login credentials'?'אימייל או סיסמה שגויים':err.message);
    setLoading(false);
  };
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#0f172a',fontFamily:"'Rubik','Segoe UI',Arial,sans-serif"}}>
      <div style={{background:'#1e293b',borderRadius:'16px',padding:'40px',width:'100%',maxWidth:'380px',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'28px',justifyContent:'center'}}>
          <div style={{width:'48px',height:'48px',background:'#f97316',borderRadius:'12px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',fontWeight:'800',color:'#fff',flexShrink:0}}>W</div>
          <div><div style={{color:'#f1f5f9',fontSize:'18px',fontWeight:'700'}}>WIN CRM</div><div style={{color:'#64748b',fontSize:'12px'}}>אמיתי כהן</div></div>
        </div>
        <p style={{color:'#94a3b8',fontSize:'14px',textAlign:'center',marginBottom:'22px',direction:'rtl'}}>התחבר כדי לגשת למערכת</p>
        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:'14px',direction:'rtl'}}>
          <div><label style={{display:'block',fontSize:'11px',fontWeight:'600',color:'#64748b',marginBottom:'5px',textTransform:'uppercase',letterSpacing:'.04em'}}>אימייל</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required style={inp} placeholder="your@email.com"/></div>
          <div><label style={{display:'block',fontSize:'11px',fontWeight:'600',color:'#64748b',marginBottom:'5px',textTransform:'uppercase',letterSpacing:'.04em'}}>סיסמה</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required style={inp} placeholder="••••••••"/></div>
          {error&&<div style={{color:'#fca5a5',fontSize:'12px',background:'rgba(239,68,68,.12)',border:'1px solid rgba(239,68,68,.3)',padding:'8px 12px',borderRadius:'7px'}}>{error}</div>}
          <button type="submit" disabled={loading} style={{padding:'11px',background:loading?'#7c3400':'#f97316',color:'#fff',border:'none',borderRadius:'9px',fontSize:'14px',fontWeight:'600',cursor:loading?'not-allowed':'pointer',fontFamily:'inherit',marginTop:'4px',transition:'background .15s'}}>
            {loading?'מתחבר...':'כניסה למערכת'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════ APP ═══════════════ */
function App(){
  const [page,setPage]=useState('dashboard');
  const [contacts,setContacts]=useState([]);
  const [deals,setDeals]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [instructors,setInstructors]=useState([]);
  const [students,setStudents]=useState([]);
  const [dark,setDark]=useLS('crm_darkmode',false);
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',dark?'dark':'light');},[dark]);

  const loadAll=async()=>{
    setLoading(true);
    try{
      const [c,d,t,i,s]=await Promise.all([
        sb.from('contacts').select('*').order('created_at',{ascending:false}),
        sb.from('deals').select('*').order('created_at',{ascending:false}),
        sb.from('tasks').select('*').order('created_at',{ascending:false}),
        sb.from('instructors').select('*').order('created_at',{ascending:false}),
        sb.from('students').select('*').order('created_at',{ascending:false}),
      ]);
      if(c.data)setContacts(c.data.map(fromDbContact));
      if(d.data)setDeals(d.data.map(fromDbDeal));
      if(t.data)setTasks(t.data.map(fromDbTask));
      if(i.data)setInstructors(i.data.map(fromDbInstructor));
      if(s.data)setStudents(s.data.map(fromDbStudent));
    }catch(e){console.error('loadAll error:',e);}
    setLoading(false);
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user??null);
      if(session?.user)loadAll();else setLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user??null);
      if(session?.user)loadAll();
      else{setLoading(false);setContacts([]);setDeals([]);setTasks([]);setInstructors([]);setStudents([]);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const signOut=()=>sb.auth.signOut();

  // Activity logger – optimistic + async persist
  const logAct=(cid,desc)=>{
    if(!cid)return;
    const act={id:genId(),desc,date:new Date().toISOString()};
    setContacts(prev=>prev.map(c=>{
      if(c.id!==cid)return c;
      const newActs=[...(c.activities||[]),act];
      sb.from('contacts').update({activities:newActs}).eq('id',cid).then();
      return{...c,activities:newActs};
    }));
  };

  // Contacts
  const addContact=async data=>{
    const now=new Date().toISOString();
    const initAct=[{id:genId(),desc:'נוסף איש קשר חדש',date:now}];
    const dbRow={...toDbContact(data),activities:initAct,notes:data.notes||[],tags:data.tags||[],created_at:now,updated_at:now};
    const {data:row,error}=await sb.from('contacts').insert(dbRow).select().single();
    if(!error&&row)setContacts(p=>[fromDbContact(row),...p]);
  };
  const updateContact=async(id,data)=>{
    setContacts(p=>p.map(c=>c.id===id?{...c,...data,updatedAt:new Date().toISOString()}:c));
    await sb.from('contacts').update(toDbContact(data)).eq('id',id);
  };
  const deleteContact=async id=>{
    setContacts(p=>p.filter(c=>c.id!==id));
    setDeals(p=>p.filter(d=>d.contactId!==id));
    setTasks(p=>p.map(t=>t.contactId===id?{...t,contactId:''}:t));
    setStudents(p=>p.map(s=>s.contactId===id?{...s,contactId:''}:s));
    await sb.from('contacts').delete().eq('id',id);
  };

  // Deals
  const addDeal=async data=>{
    const {data:row,error}=await sb.from('deals').insert(toDbDeal(data)).select().single();
    if(!error&&row){setDeals(p=>[fromDbDeal(row),...p]);if(data.contactId)logAct(data.contactId,`נוצרה עסקה: ${data.title}`);}
  };
  const updateDeal=async(id,data,prevStage)=>{
    setDeals(p=>p.map(d=>d.id===id?{...d,...data}:d));
    await sb.from('deals').update(toDbDeal(data)).eq('id',id);
    if(data.contactId&&prevStage&&prevStage!==data.stage){const st=STAGES.find(s=>s.id===data.stage);logAct(data.contactId,`עסקה עודכנה: ${data.title} → ${st?.label}`);}
  };
  const deleteDeal=async id=>{setDeals(p=>p.filter(d=>d.id!==id));await sb.from('deals').delete().eq('id',id);};

  // Tasks
  const addTask=async data=>{
    const {data:row,error}=await sb.from('tasks').insert({...toDbTask(data),completed:false}).select().single();
    if(!error&&row)setTasks(p=>[fromDbTask(row),...p]);
  };
  const updateTask=async(id,data)=>{
    setTasks(p=>p.map(t=>t.id===id?{...t,...data}:t));
    await sb.from('tasks').update(toDbTask(data)).eq('id',id);
  };
  const deleteTask=async id=>{setTasks(p=>p.filter(t=>t.id!==id));await sb.from('tasks').delete().eq('id',id);};
  const toggleTask=async id=>{
    const t=tasks.find(x=>x.id===id);if(!t)return;
    const done=!t.completed;
    setTasks(p=>p.map(x=>x.id===id?{...x,completed:done}:x));
    await sb.from('tasks').update({completed:done}).eq('id',id);
    if(done&&t.contactId)logAct(t.contactId,`משימה הושלמה: ${t.title}`);
  };

  // Instructors
  const addInstructor=async data=>{
    const {data:row,error}=await sb.from('instructors').insert(toDbInstructor(data)).select().single();
    if(!error&&row)setInstructors(p=>[fromDbInstructor(row),...p]);
  };
  const updateInstructor=async(id,data)=>{
    setInstructors(p=>p.map(i=>i.id===id?{...i,...data}:i));
    await sb.from('instructors').update(toDbInstructor(data)).eq('id',id);
  };
  const deleteInstructor=async id=>{setInstructors(p=>p.filter(i=>i.id!==id));await sb.from('instructors').delete().eq('id',id);};

  // Students
  const addStudent=async data=>{
    const {data:row,error}=await sb.from('students').insert(toDbStudent(data)).select().single();
    if(!error&&row)setStudents(p=>[fromDbStudent(row),...p]);
  };
  const updateStudent=async(id,data)=>{
    setStudents(p=>p.map(s=>s.id===id?{...s,...data}:s));
    await sb.from('students').update(toDbStudent(data)).eq('id',id);
  };
  const deleteStudent=async id=>{setStudents(p=>p.filter(s=>s.id!==id));await sb.from('students').delete().eq('id',id);};

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#0f172a',flexDirection:'column',gap:'14px',fontFamily:"'Rubik','Segoe UI',Arial,sans-serif"}}>
      <div style={{width:'52px',height:'52px',background:'#f97316',borderRadius:'13px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'26px',fontWeight:'800',color:'#fff'}}>W</div>
      <p style={{color:'#94a3b8',fontSize:'14px'}}>טוען...</p>
    </div>
  );
  if(!user)return <AuthScreen/>;

  const pages={
    dashboard:<Dashboard contacts={contacts} deals={deals} tasks={tasks} instructors={instructors} students={students} dark={dark}/>,
    contacts:<ContactsPage contacts={contacts} deals={deals} onAdd={addContact} onUpdate={updateContact} onDelete={deleteContact}/>,
    deals:<DealsPage deals={deals} contacts={contacts} onAdd={addDeal} onUpdate={updateDeal} onDelete={deleteDeal}/>,
    tasks:<TasksPage tasks={tasks} contacts={contacts} onAdd={addTask} onUpdate={updateTask} onDelete={deleteTask} onToggle={toggleTask}/>,
    instructors:<InstructorsPage instructors={instructors} contacts={contacts} onAdd={addInstructor} onUpdate={updateInstructor} onDelete={deleteInstructor}/>,
    students:<StudentsPage students={students} contacts={contacts} onAdd={addStudent} onUpdate={updateStudent} onDelete={deleteStudent}/>,
  };

  return(
    <div className="app">
      <Sidebar page={page} setPage={setPage} tasks={tasks} instructors={instructors} students={students} deals={deals} dark={dark} setDark={setDark} user={user} signOut={signOut}/>
      <main className="main">{pages[page]||pages.dashboard}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
